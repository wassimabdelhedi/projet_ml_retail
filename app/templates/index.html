<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Retail - Prédiction Comportement Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-chart-line"></i> ML Retail Analytics
            </span>
            <span class="navbar-text text-white-50">
                Prédiction Comportement Client
            </span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <!-- Colonne Formulaire -->
            <div class="col-lg-6">
                <div class="card shadow-lg border-0 h-100">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-user"></i> Données Client</h4>
                    </div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="mb-4">
                                <label for="Recency" class="form-label">Dernier achat (jours)</label>
                                <input type="number" class="form-control form-control-lg" id="Recency" name="Recency"
                                    placeholder="Ex: 15" min="0" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label for="Frequency" class="form-label">Nombre de commandes</label>
                                    <input type="number" class="form-control form-control-lg" id="Frequency"
                                        name="Frequency" placeholder="Ex: 5" min="0" required>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="Age" class="form-label">Âge du client</label>
                                    <input type="number" class="form-control form-control-lg" id="Age" name="Age"
                                        placeholder="Ex: 35" min="18" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="MonetaryTotal" class="form-label">Chiffre d'affaires total (£)</label>
                                <input type="number" class="form-control form-control-lg" id="MonetaryTotal"
                                    name="MonetaryTotal" placeholder="Ex: 250" step="0.01" min="0" required>
                            </div>

                            <!-- Valeurs techniques par défaut (cachées) -->
                            <input type="hidden" name="SatisfactionScore" value="4">
                            <input type="hidden" name="SupportTicketsCount" value="0">
                            <input type="hidden" name="AvgDaysBetweenPurchases" value="30">
                            <input type="hidden" name="CustomerTenureDays" value="365">
                            <input type="hidden" name="CancelledTransactions" value="0">
                            <input type="hidden" name="TotalTransactions" value="5">

                            <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm">
                                <i class="fas fa-play"></i> Lancer la Prédiction
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Colonne Résultats Simplifiée -->
            <div class="col-lg-6">
                <div id="resultsContainer" style="display: none;">
                    <div class="card shadow-lg border-0 mb-4">
                        <div class="card-header text-center" id="churnHeader">
                            <h4 class="mb-0">RÉSULTATS DE L'ANALYSE</h4>
                        </div>
                        <div class="card-body">
                            <!-- Churn Section -->
                            <div class="text-center mb-5">
                                <h6 class="text-uppercase text-muted small">Risque de départ (Churn)</h6>
                                <h2 id="churnStatus" class="display-6 fw-bold"></h2>
                                <div class="progress mt-2" style="height: 12px;">
                                    <div id="churnProgressBar" class="progress-bar" role="progressbar"
                                        style="width: 0%"></div>
                                </div>
                                <span id="churnPercentage" class="fw-bold">0%</span>
                            </div>

                            <hr>

                            <!-- Infos clés -->
                            <div class="row text-center mt-4">
                                <div class="col-6 border-end">
                                    <h6 class="text-uppercase text-muted small">Segment Client</h6>
                                    <h4 id="segmentName" class="fw-bold text-primary"></h4>
                                    <div id="segmentEmoji" style="font-size: 2rem;"></div>
                                </div>
                                <div class="col-6">
                                    <h6 class="text-uppercase text-muted small">Valeur Prédite</h6>
                                    <h4 id="predictedSpend" class="fw-bold text-success"></h4>
                                    <span id="spendCategory" class="badge bg-light text-dark"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <button onclick="resetForm()" class="btn btn-outline-light btn-sm">
                            <i class="fas fa-undo"></i> Nouvelle analyse
                        </button>
                    </div>
                </div>

                <!-- Message initial -->
                <div id="initialMessage" class="card shadow-lg border-0 h-100">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center">
                        <i class="fas fa-robot text-primary mb-4" style="font-size: 4rem; opacity: 0.2;"></i>
                        <h5 class="text-muted">Prêt pour l'analyse</h5>
                        <p class="text-muted px-4">Utilisez le formulaire pour prédire le comportement du client.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="spinner-border" role="status"
        style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999;">
        <span class="visually-hidden">Chargement...</span>
    </div>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="text-muted mb-0">
            <i class="fas fa-copyright"></i> ML Retail - Analyse Comportement Client
        </p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>

</body>

</html>
